<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Landing Page - Cute Style</title>
    <!-- นำเข้าฟอนต์สไตล์น่ารักๆ จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Mali:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* โทนสีเริ่มต้น (ชมพู-ขาว) สไตล์ญี่ปุ่น */
            --bg-color: #FFF0F5;
            --card-bg: #FFFFFF;
            --text-main: #5C4033; /* ใช้สีน้ำตาลเข้มแทนสีดำเพื่อความละมุน */
            --text-sub: #886F60;
            --btn-bg: #FFB7C5;
            --btn-hover: #FF9EAE;
            --border-color: #FFE4E1;
        }

        * {
            box-sizing: border-box;
            /* ใช้ฟอนต์น่ารักๆ ขอบมน */
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.4s ease;
            position: relative;
            min-height: 100vh;
        }

        /* ปุ่มฟันเฟืองสำหรับแอดมิน (ซ่อนรูปทรงให้กลืนกับเว็บ) */
        .admin-gear-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.4s, background-color 0.3s;
            color: var(--btn-bg);
            z-index: 100;
        }

        .admin-gear-btn:hover {
            transform: rotate(90deg);
            background-color: var(--bg-color);
        }

        .container {
            max-width: 600px; /* ปรับให้แคบลงนิดหน่อยเพื่อให้ดูเป็นสัดส่วนน่ารัก */
            margin: 60px auto 40px;
            padding: 0 20px;
        }

        /* Card Styles - เน้นความโค้งมนขั้นสุด */
        .card {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 35px; /* ขอบโค้งมนมาก */
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(255, 183, 197, 0.3); /* เงาฟุ้งๆ */
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .text-center { text-align: center; }
        .mb-15 { margin-bottom: 15px; }
        .mb-20 { margin-bottom: 20px; }
        
        h1, h2, h3 { 
            color: var(--text-main); 
            font-family: 'Mali', cursive; /* หัวข้อใช้ฟอนต์ลายมือ */
        }
        p { color: var(--text-sub); line-height: 1.6; }

        /* Customer View Specific */
        .account-box {
            background-color: var(--bg-color);
            border: 2px dashed var(--border-color);
            padding: 25px 15px;
            border-radius: 25px; /* ขอบโค้งมน */
            margin: 25px 0;
        }

        .acc-number {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--text-main);
            margin: 10px 0;
        }

        .img-preview {
            max-width: 180px;
            border-radius: 25px;
            border: 3px solid var(--border-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* Buttons - ทรงแคปซูล */
        .btn-primary {
            background-color: var(--btn-bg);
            color: #ffffff;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 50px; /* ปุ่มโค้งมนเป็นแคปซูล */
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .btn-primary:hover {
            background-color: var(--btn-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
        }

        .btn-block { width: 100%; }

        /* Admin Form Styles */
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            padding-left: 10px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 20px; /* ฟอร์มโค้งมน */
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
            background-color: #fafafa;
        }

        .form-control:focus {
            border-color: var(--btn-bg);
            background-color: #ffffff;
        }

        textarea.form-control { resize: vertical; height: 100px; border-radius: 20px; }

        /* Color Picker Section */
        .color-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 15px;
            text-align: left;
        }

        .color-item {
            display: flex;
            flex-direction: column;
            font-size: 12px;
            font-weight: 600;
        }

        .color-item input[type="color"] {
            width: 100%;
            height: 40px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            padding: 2px;
            background: #fff;
        }

        .theme-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
            justify-content: center;
        }

        .theme-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .theme-btn:hover { 
            background: var(--btn-bg); 
            color: #fff;
            border-color: var(--btn-bg);
        }

        /* SVG Icons */
        .icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .icon-gear {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .hidden { display: none !important; }

        #alert-msg {
            display: none;
            background-color: var(--btn-bg);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 50px;
            margin-bottom: 20px;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <!-- ปุ่มฟันเฟืองสำหรับเข้าสู่ระบบแอดมิน -->
    <div class="admin-gear-btn" onclick="promptAdminLogin()">
        <svg class="icon-gear" viewBox="0 0 24 24">
            <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
    </div>

    <div class="container">
        <div id="alert-msg"></div>

        <!-- ================= CUSTOMER VIEW ================= -->
        <div id="customer-view">
            <div class="card text-center">
                <img id="cv-image" src="" alt="Payment Graphic" class="img-preview mb-15">
                <h2 id="cv-title" class="mb-15"></h2>
                <p id="cv-desc"></p>

                <div class="account-box">
                    <div id="cv-bank-name"></div>
                    <div class="acc-number" id="cv-acc-number"></div>
                    <div id="cv-acc-name" class="mb-15"></div>
                    
                    <button class="btn-primary" onclick="copyAccount()">
                        <svg class="icon" viewBox="0 0 24 24">
                            <path d="M16 1H4C2.9 1 2 1.9 2 3V17H4V3H16V1ZM19 5H8C6.9 5 6 5.9 6 7V21C6 22.1 6.9 23 8 23H19C20.1 23 21 22.1 21 21V7C21 5.9 20.1 5 19 5ZM19 21H8V7H19V21Z"/>
                        </svg>
                        คัดลอกเลขบัญชี
                    </button>
                </div>
                
                <a id="cv-contact-link" href="#" target="_blank" class="btn-primary btn-block" style="text-decoration: none;">
                    แจ้งหลักฐานการโอนเงิน
                </a>
            </div>
        </div>

        <!-- ================= ADMIN VIEW ================= -->
        <div id="admin-view" class="hidden">
            <div class="card text-center">
                <h2 class="mb-20">ตั้งค่าหน้าเว็บ</h2>
                
                <h3 style="font-size: 16px; margin-bottom: 10px;">เลือกชุดสีเริ่มต้น</h3>
                <div class="theme-buttons" id="theme-container">
                    <!-- Buttons generated by JS -->
                </div>

                <hr class="mb-20" style="border-top: 2px dashed var(--border-color);">

                <h3 style="font-size: 16px; margin-bottom: 10px;">ปรับแต่งสีเอง</h3>
                <div class="color-grid mb-20">
                    <div class="color-item">
                        <label>สีพื้นหลังเว็บ</label>
                        <input type="color" id="color-bg">
                    </div>
                    <div class="color-item">
                        <label>สีกล่องข้อความ</label>
                        <input type="color" id="color-card">
                    </div>
                    <div class="color-item">
                        <label>สีตัวอักษรหลัก</label>
                        <input type="color" id="color-text-main">
                    </div>
                    <div class="color-item">
                        <label>สีตัวอักษรรอง</label>
                        <input type="color" id="color-text-sub">
                    </div>
                    <div class="color-item">
                        <label>สีปุ่ม</label>
                        <input type="color" id="color-btn-bg">
                    </div>
                    <div class="color-item">
                        <label>สีปุ่ม (Hover)</label>
                        <input type="color" id="color-btn-hover">
                    </div>
                    <div class="color-item">
                        <label>สีเส้นขอบ</label>
                        <input type="color" id="color-border">
                    </div>
                </div>

                <hr class="mb-20" style="border-top: 2px dashed var(--border-color);">

                <h3 style="font-size: 16px; margin-bottom: 15px;">แก้ไขข้อมูล</h3>
                <div class="form-group">
                    <label>หัวข้อหน้าเว็บ</label>
                    <input type="text" id="input-title" class="form-control">
                </div>
                <div class="form-group">
                    <label>รายละเอียด / ข้อความ</label>
                    <textarea id="input-desc" class="form-control"></textarea>
                </div>
                <div class="form-group">
                    <label>URL รูปภาพโลโก้/QR Code</label>
                    <input type="text" id="input-image" class="form-control" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>ธนาคาร</label>
                    <input type="text" id="input-bank-name" class="form-control">
                </div>
                <div class="form-group">
                    <label>เลขที่บัญชี</label>
                    <input type="text" id="input-acc-number" class="form-control">
                </div>
                <div class="form-group">
                    <label>ชื่อบัญชี</label>
                    <input type="text" id="input-acc-name" class="form-control">
                </div>
                <div class="form-group">
                    <label>ลิงก์สำหรับติดต่อร้าน</label>
                    <input type="text" id="input-contact" class="form-control" placeholder="https://lin.ee/...">
                </div>

                <button class="btn-primary btn-block" onclick="saveAdminData()" style="margin-top: 10px;">
                    <svg class="icon" viewBox="0 0 24 24">
                        <path d="M17 3H5C3.89 3 3 3.9 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V7L17 3ZM19 19H5V5H16.17L19 7.83V19ZM12 12C10.34 12 9 13.34 9 15C9 16.66 10.34 18 12 18C13.66 18 15 16.66 15 15C15 13.34 13.66 12 12 12ZM6 6H15V9H6V6Z"/>
                    </svg>
                    บันทึกและดูตัวอย่าง
                </button>
            </div>
        </div>
    </div>

    <script>
        // ชุดสีพรีเซ็ต
        const themes = {
            "ชมพู-ขาว": { bg: "#FFF0F5", card: "#FFFFFF", textMain: "#5C4033", textSub: "#886F60", btnBg: "#FFB7C5", btnHover: "#FF9EAE", border: "#FFE4E1" },
            "ดำ-ขาว": { bg: "#F5F5F5", card: "#FFFFFF", textMain: "#333333", textSub: "#777777", btnBg: "#555555", btnHover: "#333333", border: "#E0E0E0" },
            "ฟ้า-ขาว": { bg: "#F0F8FF", card: "#FFFFFF", textMain: "#2C3E50", textSub: "#5D6D7E", btnBg: "#85C1E9", btnHover: "#5DADE2", border: "#D6EAF8" },
            "ฟ้า-เหลือง": { bg: "#EBF5FB", card: "#FFFFFF", textMain: "#154360", textSub: "#2980B9", btnBg: "#F4D03F", btnHover: "#F1C40F", border: "#AED6F1" },
            "ฟ้า-เขียว": { bg: "#E0FFFF", card: "#FFFFFF", textMain: "#0B5345", textSub: "#148F77", btnBg: "#48C9B0", btnHover: "#1ABC9C", border: "#A3E4D7" },
            "ม่วง-ขาว": { bg: "#F4ECF7", card: "#FFFFFF", textMain: "#4A235A", textSub: "#7D3C98", btnBg: "#C39BD3", btnHover: "#AF7AC5", border: "#E8DAEF" },
            "เอิร์ธโทน": { bg: "#F9E79F", card: "#FFFFFF", textMain: "#784212", textSub: "#935116", btnBg: "#E59866", btnHover: "#DC7633", border: "#FAD7A1" },
            "ดำ-แดง": { bg: "#FDEDEC", card: "#FFFFFF", textMain: "#641E16", textSub: "#922B21", btnBg: "#F1948A", btnHover: "#E74C3C", border: "#F5B7B1" },
            "เขียวมิ้นต์": { bg: "#E8F8F5", card: "#FFFFFF", textMain: "#0E6251", textSub: "#117A65", btnBg: "#73C6B6", btnHover: "#45B39D", border: "#D1F2EB" },
            "ส้ม-ขาว": { bg: "#FEF5E7", card: "#FFFFFF", textMain: "#6E2C00", textSub: "#A04000", btnBg: "#F5CBA7", btnHover: "#F0B27A", border: "#FDEBD0" }
        };

        const defaultData = {
            title: "ชำระค่าสินค้า",
            desc: "กรุณาโอนเงินและส่งสลิปผ่านทาง LINE Official นะคะ",
            imageUrl: "https://via.placeholder.com/200x200?text=LOGO",
            bankName: "ธนาคารกสิกรไทย",
            accNumber: "123-4-56789-0",
            accName: "บจก. สินค้าน่ารัก",
            contactLink: "#",
            colors: themes["ชมพู-ขาว"]
        };

        function init() {
            renderThemeButtons();
            loadData();
        }

        function promptAdminLogin() {
            const adminView = document.getElementById('admin-view');
            
            // หากหน้าแอดมินปิดอยู่ ให้ถามรหัส
            if (adminView.classList.contains('hidden')) {
                // รหัสผ่านตัวอย่างคือ 1234
                let pwd = prompt("กรุณาใส่รหัสผ่านเพื่อตั้งค่าระบบ (รหัสทดสอบ: 1234)");
                if (pwd === "1234") {
                    document.getElementById('admin-view').classList.remove('hidden');
                    document.getElementById('customer-view').classList.add('hidden');
                } else if (pwd !== null) {
                    alert("รหัสผ่านไม่ถูกต้อง!");
                }
            } else {
                // หากเปิดอยู่ ให้สลับกลับไปหน้าลูกค้า
                document.getElementById('admin-view').classList.add('hidden');
                document.getElementById('customer-view').classList.remove('hidden');
                loadData(); // รีโหลดเผื่อแก้ไขแล้วไม่ได้บันทึก
            }
        }

        function renderThemeButtons() {
            const container = document.getElementById('theme-container');
            for (let themeName in themes) {
                const btn = document.createElement('button');
                btn.className = 'theme-btn';
                btn.textContent = themeName;
                btn.onclick = () => applyPresetTheme(themeName);
                container.appendChild(btn);
            }
        }

        function applyPresetTheme(themeName) {
            const colors = themes[themeName];
            document.getElementById('color-bg').value = colors.bg;
            document.getElementById('color-card').value = colors.card;
            document.getElementById('color-text-main').value = colors.textMain;
            document.getElementById('color-text-sub').value = colors.textSub;
            document.getElementById('color-btn-bg').value = colors.btnBg;
            document.getElementById('color-btn-hover').value = colors.btnHover;
            document.getElementById('color-border').value = colors.border;
            
            applyColorsToCSS(colors);
        }

        function loadData() {
            const savedData = localStorage.getItem('paymentPageKawaii');
            const data = savedData ? JSON.parse(savedData) : defaultData;

            document.getElementById('input-title').value = data.title;
            document.getElementById('input-desc').value = data.desc;
            document.getElementById('input-image').value = data.imageUrl;
            document.getElementById('input-bank-name').value = data.bankName;
            document.getElementById('input-acc-number').value = data.accNumber;
            document.getElementById('input-acc-name').value = data.accName;
            document.getElementById('input-contact').value = data.contactLink;

            document.getElementById('color-bg').value = data.colors.bg;
            document.getElementById('color-card').value = data.colors.card;
            document.getElementById('color-text-main').value = data.colors.textMain;
            document.getElementById('color-text-sub').value = data.colors.textSub;
            document.getElementById('color-btn-bg').value = data.colors.btnBg;
            document.getElementById('color-btn-hover').value = data.colors.btnHover;
            document.getElementById('color-border').value = data.colors.border;

            updateCustomerView(data);
        }

        function saveAdminData() {
            const dataToSave = {
                title: document.getElementById('input-title').value,
                desc: document.getElementById('input-desc').value,
                imageUrl: document.getElementById('input-image').value,
                bankName: document.getElementById('input-bank-name').value,
                accNumber: document.getElementById('input-acc-number').value,
                accName: document.getElementById('input-acc-name').value,
                contactLink: document.getElementById('input-contact').value,
                colors: {
                    bg: document.getElementById('color-bg').value,
                    card: document.getElementById('color-card').value,
                    textMain: document.getElementById('color-text-main').value,
                    textSub: document.getElementById('color-text-sub').value,
                    btnBg: document.getElementById('color-btn-bg').value,
                    btnHover: document.getElementById('color-btn-hover').value,
                    border: document.getElementById('color-border').value
                }
            };

            localStorage.setItem('paymentPageKawaii', JSON.stringify(dataToSave));
            updateCustomerView(dataToSave);
            
            const alertMsg = document.getElementById('alert-msg');
            alertMsg.textContent = "บันทึกข้อมูลเรียบร้อยแล้ว!";
            alertMsg.style.display = "block";
            
            setTimeout(() => {
                alertMsg.style.display = "none";
                document.getElementById('admin-view').classList.add('hidden');
                document.getElementById('customer-view').classList.remove('hidden');
            }, 1000);
        }

        function updateCustomerView(data) {
            document.getElementById('cv-title').textContent = data.title;
            document.getElementById('cv-desc').textContent = data.desc;
            document.getElementById('cv-image').src = data.imageUrl;
            document.getElementById('cv-bank-name').textContent = data.bankName;
            document.getElementById('cv-acc-number').textContent = data.accNumber;
            document.getElementById('cv-acc-name').textContent = "ชื่อบัญชี: " + data.accName;
            document.getElementById('cv-contact-link').href = data.contactLink;

            applyColorsToCSS(data.colors);
        }

        function applyColorsToCSS(colors) {
            const root = document.documentElement;
            root.style.setProperty('--bg-color', colors.bg);
            root.style.setProperty('--card-bg', colors.card);
            root.style.setProperty('--text-main', colors.textMain);
            root.style.setProperty('--text-sub', colors.textSub);
            root.style.setProperty('--btn-bg', colors.btnBg);
            root.style.setProperty('--btn-hover', colors.btnHover);
            root.style.setProperty('--border-color', colors.border);
        }

        function copyAccount() {
            const accNum = document.getElementById('cv-acc-number').textContent;
            navigator.clipboard.writeText(accNum).then(() => {
                alert("คัดลอกเลขบัญชี " + accNum + " เรียบร้อยแล้ว");
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }

        window.onload = init;
    </script>
</body>
</html>
